<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Metallic/Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Food / Ruby Red Flame Gradient -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Silver/White 3D Gradient -->
    <linearGradient id="white3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Outer Glow & Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container with 3D Border -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Subtle Inner Top Highlight -->
  <path d="M 12 36 C 12 22 22 12 36 12 L 92 12 C 106 12 116 22 116 36 Q 64 24 12 36 Z" fill="#ffffff" opacity="0.12" />

  <!-- Stylized 3D "R" & "F" Monogram / Food Fork/Flame Emblem -->
  <g filter="url(#innerGlow)">
    <!-- Main "R" Shape -->
    <path d="M 32 34 L 56 34 C 68 34 76 41 76 51 C 76 60 69 66 58 68 L 76 94 L 62 94 L 46 70 L 44 70 L 44 94 L 32 94 Z M 44 45 L 44 59 L 55 59 C 61 59 64 56 64 52 C 64 47 60 45 55 45 Z" fill="url(#white3d)" />
    
    <!-- Accent "F" wing / Gold Flare -->
    <path d="M 72 34 L 96 34 L 96 44 L 84 44 L 84 52 L 94 52 L 94 62 L 84 62 L 84 74 L 72 74 Z" fill="url(#goldGrad)" />
    
    <!-- Small Premium Ruby Star/Dot Accent -->
    <circle cx="88" cy="86" r="6.5" fill="url(#rubyGrad)" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
